<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>K76.A03 - Hệ Thống Ôn Thi VHPT - Dạng 1 Chọn 1 đáp án</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { 
            --primary: #2c3e50; --secondary: #27ae60; --danger: #e74c3c; 
            --accent: #2980b9; --light: #f4f7f6; --shadow: 0 12px 35px rgba(0,0,0,0.3);
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; 
            color: #1a1a1a; font-size: 20px; background-color: var(--light);
            background: linear-gradient(rgba(244, 247, 246, 0.9), rgba(244, 247, 246, 0.9)), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1920&q=80');
            background-attachment: fixed; background-size: cover;
        }

        .container { 
            max-width: 1250px; margin: 30px auto; background: rgba(255, 255, 255, 0.98); 
            padding: 35px; border-radius: 30px; box-shadow: var(--shadow);
            border: 1px solid white;
        }

        /* Header Info */
        .header-info { text-align: center; margin-bottom: 25px; border-bottom: 5px double var(--primary); padding-bottom: 20px; }
        .header-info h1 { font-size: 36px; color: var(--primary); text-transform: uppercase; margin: 0; }
        .header-info h2 { color: var(--accent); margin: 10px 0; font-size: 28px; }

        /* Nút bấm 3D phong cách hiện đại */
        nav { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        button { 
            padding: 14px 24px; border: none; border-radius: 15px; cursor: pointer; 
            font-weight: bold; font-size: 18px; transition: all 0.1s;
            box-shadow: 0 6px #7f8c8d; position: relative; outline: none;
        }
        button:active { box-shadow: 0 0 #7f8c8d; transform: translateY(6px); }
        .btn-main { background: var(--primary); color: white; }
        .btn-sub { background: var(--accent); color: white; box-shadow: 0 6px #1a5276; }
        .btn-orange { background: #d35400; color: white; box-shadow: 0 6px #a04000; }
        .btn-purple { background: #8e44ad; color: white; box-shadow: 0 6px #6c3483; }
        .btn-green { background: var(--secondary); color: white; box-shadow: 0 6px #196f3d; }

        /* Giao diện câu hỏi */
        .q-block { border: 1px solid #cfd8dc; padding: 30px; margin: 15px 0; border-radius: 20px; background: #fff; border-left: 10px solid var(--accent); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .q-block p { font-weight: bold; font-size: 26px; color: #0d47a1; line-height: 1.4; margin-top: 0; }
        .option-item { display: flex; align-items: center; margin: 12px 0; padding: 15px; border-radius: 15px; border: 1px solid #eee; cursor: pointer; transition: 0.2s; }
        .option-item:hover { background: #e3f2fd; border-color: var(--accent); }
        input[type="radio"] { width: 35px; height: 35px; margin-right: 20px; cursor: pointer; flex-shrink: 0; }
        
        /* Trạng thái đáp án */
        .correct-ans { background: #e8f5e9 !important; border-left: 15px solid #2e7d32 !important; }
        .wrong-ans { background: #ffebee !important; border-left: 15px solid #c62828 !important; }
        .ans-highlight { color: #2e7d32; font-weight: bold; background: #e8f5e9; padding: 4px 12px; border-radius: 8px; }

        .result-header { background: #fff9c4; border: 4px solid #fbc02d; padding: 25px; margin-bottom: 25px; border-radius: 20px; text-align: center; display: none; }
        .table-area { max-height: 600px; overflow-y: auto; border-radius: 20px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #eceff1; padding: 20px; position: sticky; top: 0; z-index: 10; font-size: 18px; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        .hidden { display: none !important; }
        #sync-info { text-align: center; font-size: 14px; font-weight: bold; color: var(--secondary); margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="main-app" class="container">
    <div class="header-info">
        <h1>Hệ thống ôn tập thi trắc nghiệm</h1>
        <h2>Môn: Văn hoá Phát triển - Lớp K76.A03 - Dạng 1 Chọn 1 đáp án</h2>
        <div id="sync-info">⏳ Đang đồng bộ dữ liệu trực tuyến...</div>
    </div>

    <nav>
        <button class="btn-main" onclick="startQuiz(10, 'Thi ngẫu nhiên 10 câu')">🎲 THI 10 CÂU</button>
        <button class="btn-orange" onclick="startQuiz(20, 'Thi ngẫu nhiên 20 câu')">🔥 THI 20 CÂU</button>
        <button class="btn-sub" onclick="showSeqBar()">🔢 THEO BỘ ĐỀ</button>
        <button class="btn-green" onclick="renderViewAll()">📚 XEM TẤT CẢ ĐỀ</button>
        <button class="btn-main" style="background:#f39c12; box-shadow: 0 6px #d35400;" onclick="renderHistory()">📜 LỊCH SỬ THI</button>
    </nav>

    <div id="top-result" class="result-header">
        <div id="score-text"></div>
        <button class="btn-sub" style="margin-top:15px" onclick="location.reload()">LÀM ĐỀ KHÁC</button>
    </div>

    <div id="selector-bar" class="hidden" style="background:#f1f1f1; padding:20px; border-radius:20px; margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;"></div>
    
    <div id="content-area"></div>
    
    <button class="btn-main hidden" id="global-submit" style="width:100%; font-size:26px; padding:25px; border-radius:20px; margin-top:25px" onclick="handleSubmit()">NỘP BÀI KIỂM TRA</button>
</div>

<script>
// --- CẤU HÌNH LINK GOOGLE SHEETS MỚI ---
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQcdBNKk1UcnVah-VFoLa5-6QDhGN8ZEIyAtjdCjj53Sy_gfKS5ODe1lZ_TkGBPXw/pub?output=csv';

let App = {
    sessionUser: 'Thành viên K76.A03',
    history: JSON.parse(localStorage.getItem('k76_v28_history')) || [],
    db: JSON.parse(localStorage.getItem('k76_v28_db')) || [],
    currentQs: [],
    type: ''
};

window.onload = async () => {
    await syncData();
    startQuiz(10, 'Thi ngẫu nhiên 10 câu');
};

// --- ĐỒNG BỘ DỮ LIỆU ---
async function syncData() {
    const info = document.getElementById('sync-info');
    try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const json = XLSX.utils.sheet_to_json(XLSX.read(text, {type:'string'}).Sheets[XLSX.read(text, {type:'string'}).SheetNames[0]]);
        
        App.db = json.map(r => {
            const f = (k) => Object.keys(r).find(x => x.trim().toLowerCase() === k.toLowerCase());
            return {
                bai: String(r[f('Bài')] || '?').trim(),
                q: r[f('Câu hỏi')], a: r[f('A')], b: r[f('B')], c: r[f('C')], d: r[f('D')],
                ans: (r[f('Đáp án')] || '').toString().trim().toUpperCase()
            };
        }).filter(x => x.q);
        
        localStorage.setItem('k76_v28_db', JSON.stringify(App.db));
        info.innerText = `✅ Đã cập nhật ${App.db.length} câu hỏi mới nhất từ Google Sheets.`;
    } catch(e) {
        info.innerText = "📡 Chế độ offline (Đang dùng dữ liệu cũ).";
    }
}

// --- LOGIC THI ---
function resetUI() {
    document.getElementById('content-area').innerHTML = '';
    document.getElementById('selector-bar').classList.add('hidden');
    document.getElementById('global-submit').classList.add('hidden');
    document.getElementById('top-result').style.display = 'none';
}

function startQuiz(count, type) {
    resetUI();
    App.type = type;
    if(App.db.length === 0) return document.getElementById('content-area').innerHTML = "Đang tải dữ liệu, vui lòng đợi...";
    App.currentQs = [...App.db].sort(() => 0.5 - Math.random()).slice(0, count);
    renderQuiz();
}

function renderQuiz() {
    document.getElementById('global-submit').classList.remove('hidden');
    document.getElementById('content-area').innerHTML = App.currentQs.map((q, i) => `
        <div class="q-block" id="wrap-${i}">
            <p>${i+1}. ${q.q} <span style="font-size:14px; color:#999;">(Bài ${q.bai})</span></p>
            ${['a','b','c','d'].map(opt => `
                <label class="option-item">
                    <input type="radio" name="q${i}" value="${opt.toUpperCase()}">
                    <span>${opt.toUpperCase()}. ${q[opt]}</span>
                </label>
            `).join('')}
        </div>
    `).join('');
}

function handleSubmit() {
    let score = 0;
    App.currentQs.forEach((q, i) => {
        const sel = document.querySelector(`input[name="q${i}"]:checked`);
        const wrap = document.getElementById(`wrap-${i}`);
        if(sel && sel.value === q.ans) score++;
        else { wrap.classList.add('wrong-ans'); wrap.innerHTML += `<b style="color:red; margin-left:55px; font-size:22px;">=> ĐÁP ÁN ĐÚNG: ${q.ans}</b>`; }
    });
    
    App.history.push({ date: new Date().toLocaleString('vi-VN'), type: App.type, score: `${score}/${App.currentQs.length}` });
    localStorage.setItem('k76_v28_history', JSON.stringify(App.history));

    document.getElementById('score-text').innerHTML = `<h2>KẾT QUẢ: ${score} / ${App.currentQs.length} CÂU ĐÚNG</h2>`;
    document.getElementById('top-result').style.display = 'block';
    document.getElementById('global-submit').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// --- THANH ĐIỀU HƯỚNG ---
function showSeqBar() {
    resetUI();
    const bar = document.getElementById('selector-bar'); bar.classList.remove('hidden');
    bar.innerHTML = "<b>Bộ đề: </b>";
    for(let i=0; i<Math.ceil(App.db.length/10); i++) {
        let btn = document.createElement('button'); btn.innerText = i+1; btn.className = 'btn-sub';
        btn.onclick = () => { App.type='Bộ đề '+(i+1); App.currentQs=App.db.slice(i*10,(i+1)*10); renderQuiz(); };
        bar.appendChild(btn);
    }
}

function showLessonBar() {
    resetUI();
    const bar = document.getElementById('selector-bar'); bar.classList.remove('hidden');
    const lessons = [...new Set(App.db.map(q => String(q.bai)))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    bar.innerHTML = "<b>Chọn bài: </b>";
    lessons.forEach(l => {
        let btn = document.createElement('button'); btn.innerText = "Bài "+l; btn.className = 'btn-purple';
        btn.onclick = () => { App.type='Bài '+l; App.currentQs=App.db.filter(q => String(q.bai) === l); renderQuiz(); };
        bar.appendChild(btn);
    });
}

function renderViewAll() {
    resetUI();
    document.getElementById('content-area').innerHTML = `<h2 style="text-align:center">TỔNG HỢP ĐỀ VÀ ĐÁP ÁN</h2>` + App.db.map((q, i) => `
        <div class="q-block"><p>${i+1}. ${q.q}</p>
        <div class="${q.ans==='A'?'ans-highlight':''}">A. ${q.a}</div><div class="${q.ans==='B'?'ans-highlight':''}">B. ${q.b}</div>
        <div class="${q.ans==='C'?'ans-highlight':''}">C. ${q.c}</div><div class="${q.ans==='D'?'ans-highlight':''}">D. ${q.d}</div></div>`).join('');
}

function renderHistory() {
    resetUI();
    document.getElementById('content-area').innerHTML = `<div class="table-area"><table><tr><th>Ngày thi</th><th>Loại đề</th><th>Kết quả</th></tr>${App.history.slice().reverse().map(h => `<tr><td>${h.date}</td><td>${h.type}</td><td style="color:green; font-weight:bold">${h.score}</td></tr>`).join('')}</table></div>`;
}

function adminCheck() {
    const p = prompt("Nhập mật mã quản trị:");
    if(p === 'admin') {
        resetUI();
        document.getElementById('content-area').innerHTML = `<div style="text-align:center; padding:30px;"><h3>DỮ LIỆU TỪ CLOUD GOOGLE</h3><p>Hệ thống tự động cập nhật từ link CSV của bạn.</p><button class="btn-green" onclick="syncData()">🔄 LÀM MỚI DỮ LIỆU</button><div class="table-area" style="margin-top:20px;"><table><tr><th>STT</th><th>Bài</th><th>Câu hỏi</th><th>ĐA</th></tr>${App.db.map((q,i)=>`<tr><td>${i+1}</td><td>${q.bai}</td><td>${q.q}</td><td>${q.ans}</td></tr>`).join('')}</table></div></div>`;
    } else alert("Mật mã không đúng!");
}
</script>
</body>
</html>
